global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alert.rules.yml

scrape_configs:
  - job_name: devdeakin-production
    static_configs:
      - targets: ['host.docker.internal:3002']
  - job_name: devdeakin-staging
    static_configs:
      - targets: ['host.docker.internal:3001']